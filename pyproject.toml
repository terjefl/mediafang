[project]
name = "mediafang"
version = "0.1.0"
description = "NRK TV and YouTube into Plex and Jellyfin libraries: follow series, channels and films on one page, with NFO metadata and artwork"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]",
    "pyyaml>=6",
    "pillow>=12.3.0",
]

[project.scripts]
mediafang = "mediafang.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
