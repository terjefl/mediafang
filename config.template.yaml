# Paths as the container sees them
library_dir: /library          # series; Plex/Jellyfin: /Media01/NRK
movies_dir: /movies            # films and single programs; Plex/Jellyfin: "/Media01/NRK Filmer"
data_dir: /data                # nrktv.db and temporary files

interval_minutes: 60
rate_limit: 10M                # max download speed, yt-dlp syntax; remove for no limit
pause_seconds: [5, 30]         # random pause between downloads
max_downloads_per_run: 0       # 0 = no limit
web_port: 8000
heartbeat_url:                 # Uptime Kuma push URL (optional)

plex:
  url: http://10.11.12.16:32400
  token: ""
  tv_section:                  # library section id of "NRK"
  movie_section:               # library section id of "NRK Filmer"

jellyfin:
  url: http://10.11.12.16:8096
  api_key: ""
  libraries: [NRK, NRK Filmer]
